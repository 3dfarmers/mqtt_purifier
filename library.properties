name=MqttPurifier
version=1.0.0
author=3D Farmer GmbH
maintainer=3D Farmer GmbH (https://github.com/3dfarmers)
sentence=Switch a Xiaomi air purifier on for ABS/ASA prints on a Bambu Lab printer, locally, from an ESP32.
paragraph=Reads the printer's local MQTT report (gcode_state, AMS slots), talks to the purifier over Xiaomi's miIO LAN protocol (AES-128, UDP 54321), never blocks loop(). No cloud, no Home Assistant, no smart plug. Works with any printer through a generic print-state input.
