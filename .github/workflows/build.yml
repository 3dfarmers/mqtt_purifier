name: build

on:
  push:
  pull_request:

env:
  ESP32_CORE: "3.3.8"
  ESP32_INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"

jobs:
  selftest:
    name: miIO self-test (AES vector, packet round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/miio.py selftest

  compile:
    name: compile ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: esp32,   fqbn: "esp32:esp32:esp32" }
          - { board: esp32s2, fqbn: "esp32:esp32:esp32s2:CDCOnBoot=cdc" }
          - { board: esp32s3, fqbn: "esp32:esp32:esp32s3:CDCOnBoot=cdc" }
          - { board: esp32c3, fqbn: "esp32:esp32:esp32c3:CDCOnBoot=cdc" }
          - { board: esp32c6, fqbn: "esp32:esp32:esp32c6:CDCOnBoot=cdc" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ env.ESP32_CORE }}-pubsub2.8
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "PubSubClient@2.8"
      - name: Compile examples
        run: |
          for ex in examples/*/; do
            echo "::group::$ex"
            arduino-cli compile --fqbn "${{ matrix.fqbn }}" --library . --warnings default "$ex"
            echo "::endgroup::"
          done
